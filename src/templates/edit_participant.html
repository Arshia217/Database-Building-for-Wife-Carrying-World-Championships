{% extends "base.html" %}

{% block title %}Update Country | Wife Carrying Database{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Change Participant Country</h1>
        <p class="page-subtitle">Feature 7 (Write 2 - Update): Update country representation with foreign key validation.</p>
    </div>
</div>

<div class="form-card" style="max-width: 620px; margin: 0 auto;">
    <form method="POST" action="{{ url_for('edit_participant') }}">
        <div class="form-group">
            <label class="form-label" for="participant_id">Select Competitor:</label>
            <select name="participant_id" id="participant_id" class="form-control" required>
                <option value="">-- Choose Competitor --</option>
                {% for p in participants %}
                    <option value="{{ p.participant_id }}">
                        {{ p.full_name }} (Current: {{ p.country_name }} [{{ p.country_code }}])
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label class="form-label" for="country_code">New Country of Representation:</label>
            <select name="country_code" id="country_code" class="form-control" required>
                <option value="">-- Choose Country --</option>
                {% for c in countries %}
                    <option value="{{ c.country_code }}">
                        {{ c.country_name }} ({{ c.country_code }} &bull; {{ c.region }})
                    </option>
                {% endfor %}
            </select>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 1.75rem;">
            <button type="submit" class="btn btn-secondary">Update Country &rarr;</button>
            <a href="{{ url_for('index') }}" class="btn btn-outline-dark">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
